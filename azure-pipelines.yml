trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azurerm'          # Azure DevOps service connection
  webAppName: 'first-azure-devops'      # Your App Service name

steps:
- checkout: self

- task: ArchiveFiles@2
  displayName: 'Create ZIP package'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/website.zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appName: '$(webAppName)'
    appType: 'webAppLinux'
    package: '$(Build.ArtifactStagingDirectory)/website.zip'
